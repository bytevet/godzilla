version: 2

# Keep the deliberately-pinned Docker base images (Dockerfile) and the pinned
# GitHub Actions (the workflows and .github/actions/) current via reviewable PRs,
# so we get reproducible pins without `latest`'s silent drift.
updates:
  # Base images: golang:1.27-bookworm, debian:bookworm-slim, eclipse-temurin:25-jdk.
  # The scan-time Go toolchain is COPYed from the builder, so there is one pin.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: docker

  # Action versions used across the workflows (actions/*, docker/*, etc.).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
