# Expected findings for this sample (see test/README.md).
#
# EXACTLY one: vulnSend puts request data in the destination URL. safeSend sends
# a constant URL with a tainted header, and `sendVia` receives an outbound
# request as a parameter — neither is attacker control over a destination.
#
# max is what makes this a control: without it, the outbound-parameter false
# positive would fire alongside the real finding and the sample would still pass.
findings:
    - rule: go-ssrf
      min: 1
      max: 1
      line: 37
      sink: net/http.NewRequest
