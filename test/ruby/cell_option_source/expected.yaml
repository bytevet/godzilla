# Expected findings for this sample (see test/README.md).
# min/max 1 is the assertion, and the two negatives are what it protects:
# html_escape neutralizes the value, and `options` in app/helpers is an ordinary
# parameter that must not be seeded -- the source is emitted only under app/cells,
# where the name has exactly one meaning. severity is low by design (see the
# rulepack): a cell argument may or may not be request-derived.
findings:
    - rule: ruby-xss-cell-option
      min: 1
      max: 1
      sink: "ruby:raw"
