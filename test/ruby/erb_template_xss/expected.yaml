# Expected findings for this sample (see test/README.md). Regenerate with:
#   GODZILLA_REGEN=1 go test ./test/corpus/ -run RegenerateManifests
# Rails AUTO-ESCAPES `<%= %>`, so only the escape-bypassing forms are sinks:
# `<%== %>` (line 4, lowered to raw()) and an explicit raw() (line 5). Lines 3
# and 8 are auto-escaped and line 6 is sanitized by h() — max: 2 pins that, so
# an over-broad template lowering that made every interpolation a sink fails
# here rather than silently costing precision on every Rails app.
findings:
    - rule: ruby-xss
      min: 2
      max: 2
      sink: "ruby:raw"
