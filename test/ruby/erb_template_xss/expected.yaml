# Expected findings for this sample (see test/README.md). Regenerate with:
#   GODZILLA_REGEN=1 go test ./test/corpus/ -run RegenerateManifests
# Rails AUTO-ESCAPES `<%= %>`, so only the escape-bypassing forms are sinks.
# show.html.erb: `<%== %>` (line 4, lowered to raw()) and an explicit raw()
# (line 5); lines 3 and 8 are auto-escaped and line 6 is sanitized by h().
# layout.html.erb: the second tag on line 6, and the modifier form on line 7 —
# `<%== x if y %>` keeps its sink because `<%== `/`raw((` are the same width, so
# the condition nests inside the call. `yield` on lines 4-5 must not break
# parsing.
#
# max: 4 pins the whole thing: an over-broad lowering that made every
# interpolation a sink fails the corpus rather than quietly costing precision on
# every Rails app. It also holds the coupling to ruby-xss.yaml's `ruby:raw` sink
# — narrowing that glob breaks this sample rather than silently disabling ERB
# unescaped-output detection.
findings:
    - rule: ruby-xss
      min: 4
      max: 4
      sink: "ruby:raw"
