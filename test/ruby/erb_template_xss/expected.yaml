# Expected findings for this sample (see test/README.md). Regenerate with:
#   GODZILLA_REGEN=1 go test ./test/corpus/ -run RegenerateManifests
# Rails AUTO-ESCAPES `<%= %>`, so only the escape-bypassing forms are sinks.
# show.html.erb: `<%== %>` (line 4, lowered to raw()) and an explicit raw()
# (line 5); lines 3 and 8 are auto-escaped and line 6 is sanitized by h().
# layout.html.erb: the second tag on line 6. Its line 7 is a modifier form
# (`<%== x if y %>`) whose sink is deliberately dropped — a modifier cannot sit
# inside raw()'s parens, and losing one tag's sink beats a syntax error losing
# the file. `yield` on lines 4-5 must not break parsing.
#
# max: 3 pins the whole thing: an over-broad lowering that made every
# interpolation a sink fails the corpus rather than quietly costing precision on
# every Rails app.
findings:
    - rule: ruby-xss
      min: 3
      max: 3
      sink: "ruby:raw"
