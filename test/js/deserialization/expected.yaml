# Expected findings for this sample (see test/README.md). Regenerate with:
#   GODZILLA_REGEN=1 go test ./test/corpus/ -run RegenerateManifests
# Two unserialize calls, one of them behind JSON.parse. max: 1 is the assertion:
# if JSON.parse stopped sanitizing, the count would be 2.
findings:
    - rule: js-insecure-deserialization
      min: 1
      max: 1
      sink: "node-serialize.unserialize"
