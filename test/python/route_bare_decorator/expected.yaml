# Expected findings for this sample (see test/README.md). Regenerate with:
#   GODZILLA_REGEN=1 go test ./test/corpus/ -run RegenerateManifests
# Api carries two distinct bare verbs (@post, @get), so it is a dispatch class
# and BOTH handlers seed their params — including preview(), which has no
# access-control decorator. UploadApi has a single verb but inherits from Api,
# so it qualifies too. Helper has a single bare @post and no dispatch base, so
# it is an ordinary class and stays clean; max: 3 pins that.
findings:
    - rule: py-ssrf
      min: 3
      max: 3
      sink: "py:requests.get"
