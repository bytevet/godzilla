# Expected findings for this sample (see test/README.md). Regenerate with:
#   GODZILLA_REGEN=1 go test ./test/corpus/ -run RegenerateManifests
# All three loads fire, including the pinned one: the rule is unguarded because
# trust_remote_code arrives non-constant and so cannot be read. max: 3 pins that
# a guard has not been added quietly — adding one would silently drop this to 0,
# since the flag reads as absent whether or not the caller passed it.
findings:
    - rule: py-hf-dynamic-module
      min: 3
      max: 3
