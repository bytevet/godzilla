# Expected findings for this sample (see test/README.md). Regenerate with:
#   GODZILLA_REGEN=1 go test ./test/corpus/ -run RegenerateManifests
# load() forwards trust_remote_code and must stay clean; the other two do not and
# must fire. That pair is the assertion: the guard reads the keyword's PRESENCE,
# since its value comes from config and cannot be read, and max: 2 fails if the
# guard is dropped (load() would join them) while min: 2 fails if presence stops
# being observable (all three would go silent).
findings:
    - rule: py-hf-dynamic-module
      min: 2
      max: 2
