# Expected findings for this sample (see test/README.md). Regenerate with:
#   GODZILLA_REGEN=1 go test ./test/corpus/ -run RegenerateManifests
# The option in setopt's arg #0 is a module attribute that does not
# reconstruct, so no guard can tell pycurl.URL from pycurl.POSTFIELDS — the
# sink pins the VALUE (#1) and relies on taint. fetch_fixed passes a constant
# and must stay clean, which max: 1 pins.
findings:
    - rule: py-ssrf
      min: 1
      max: 1
      line: 11
      sink: "py:c.setopt"
