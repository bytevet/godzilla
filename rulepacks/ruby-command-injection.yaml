# OS command injection (Ruby, CWE-78): untrusted request/CLI input flowing into
# a shell execution. Ruby has many ways to spawn a shell (Kernel#system/exec/`,
# %x, IO.popen, Open3.*), all of which interpret shell metacharacters when given
# a single string.
rules:
  - id: ruby-command-injection
    languages: [ruby]
    severity: critical
    cwe: CWE-78
    message: >-
      Untrusted input (request params, environment, CLI args) flows into a shell
      command execution, which may allow OS command injection. Pass the command
      and its arguments as a list (e.g. system("cmd", arg1, arg2)) so no shell is
      invoked, and validate inputs.
    # Pack-specific source: environment / CGI variables (a secondary CLI/CGI
    # source, not part of the shared request surface).
    sources:
      - "ruby:*ENV*"
    extend: [$_ruby-sources.yaml, $_ruby-propagators.yaml]
    # The multi-argument form passes argv to execve, so a tainted argument is
    # injection only when the program re-interprets it (`system("sh", "-c", x)`).
    # Suppress just the safe case. Pinning to #0 used to do that by ignoring
    # every argument after the program, which hid the shell form.
    #
    # arg[0] must be a bare program TOKEN: a backtick literal lowers to fragments
    # (`%x("ping -c 1 ", h)`) whose first argument is complete but is not one.
    when: >-
      not (len(arg) > 1
           and arg[0].Complete
           and arg[0].String matches "^[A-Za-z0-9_./-]+$"
           and not (arg[0].String matches "(^|/)(sh|bash|dash|zsh|ksh|csh|tcsh|fish|ash|busybox|env|xargs)$"))
    sinks:
      - "ruby:system"
      - "ruby:exec"
      - "ruby:spawn"
      # A backtick / %x / popen literal is always a single shell string, so any
      # tainted part is dangerous (bare = all args).
      - "ruby:%x"                    # backtick / %x{} command literal
      - "ruby:*.popen"
      - "ruby:Open3.*"
    sanitizers:
      - "ruby:Shellwords.escape"
      - "ruby:Shellwords.shellescape"
    propagators:
      - "ruby:*.strip"
      - "ruby:*.chomp"
