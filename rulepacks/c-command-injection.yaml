# OS command injection (C/C++): untrusted input flowing into a shell execution.
rules:
  - id: c-command-injection
    languages: [c, cpp]
    severity: critical
    cwe: CWE-78
    message: >-
      Untrusted input (environment, stdin, socket, command line, etc.) flows into
      a process/shell execution (system/popen/exec*), which may allow OS command
      injection. Never pass user-controlled data as the shell command or the
      program path; use a fixed program with an argument vector and validate
      inputs.
    extend: [$_c-sources.yaml, $_c-propagators.yaml]
    # An explicit program plus separate arguments never reaches a shell, so a
    # tainted argument is injection only when the program re-interprets it
    # (`"sh", "-c", x`) or is itself untrusted. Suppression needs a recognised
    # non-shell program named by a bare TOKEN, so a command string (one argument,
    # or fragments with spaces) keeps firing.
    when: >-
      not (len(arg) > 1
           and arg[0].Complete
           and arg[0].String matches "^[A-Za-z0-9_./-]+$"
           and not (arg[0].String matches "(^|/)(sh|bash|dash|zsh|ksh|csh|tcsh|fish|ash|busybox|env|xargs)$"))
    sinks:
      - "c*:system"
      - "c*:popen"
      - "c*:execl"
      - "c*:execlp"
      - "c*:execle"
      - "c*:execv"
      - "c*:execvp"
      - "c*:execvpe"
      - "c*:execvP"
      - "c*:execve"
      - "c*:execveat"
      - "c*:fexecve"
    sanitizers: []
