# Code injection: untrusted input passed to a dynamic code evaluator, which can
# lead to remote code execution.
rules:
  - id: js-code-injection
    languages: [javascript]
    severity: critical
    cwe: CWE-95
    message: >-
      Untrusted request input flows into a dynamic code evaluator (eval / Function),
      which allows arbitrary code execution. Never evaluate user-controlled strings;
      parse/validate the input instead.
    extend: $_js-sources.yaml
    sinks:
      - "js:eval"
      - "js:*.eval"
      - "js:Function"
      - "js:*.Function"
      # The vm module compiles and runs a STRING as JavaScript. It is often
      # mistaken for a sandbox — Node's own docs say it is not a security
      # mechanism — so a tainted script is code execution, not isolation.
      # Arg 1 is the context/sandbox object, so every pin is #0.
      #
      # vm.Script also covers `new vm.Script(...)`: the frontend names a
      # construction `js:new:<callee>`, which this suffix glob matches.
      - "js:*vm.runInNewContext#0"
      - "js:*vm.runInThisContext#0"
      - "js:*vm.runInContext#0"
      - "js:*vm.compileFunction#0"
      - "js:*vm.Script#0"
    sanitizers: []
    propagators: []
