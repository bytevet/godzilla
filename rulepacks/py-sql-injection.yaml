# SQL injection: untrusted request input flowing into a DB-API cursor/query
# execution without parameterization.
#
# The "#0" on each sink names the LOGICAL index of the query-string argument, so
# a parameterized cursor.execute("... = ?", userInput) -- where the untrusted
# value is a bound placeholder, not query text -- is NOT flagged.
rules:
  - id: py-sql-injection
    languages: [python]
    severity: high
    cwe: CWE-89
    message: >-
      Untrusted input flows into a database query execution without
      parameterized arguments, which may allow SQL injection. Use
      parameterized queries (e.g. cursor.execute(sql, params)) instead of
      concatenating or formatting user input into the query string.
    extend: $_py-sources.yaml
    sinks:
      - "py:*.execute#0"
      - "py:*.executemany#0"
      - "py:*.executescript#0"
      # SQLAlchemy's raw-SQL escape hatch: runs the string with no parameterization.
      - "py:*.exec_driver_sql#0"
    # An ORM's raw-SQL wrapper is a PASSTHROUGH, not a sink: sqlalchemy.text(sql)
    # returns a TextClause carrying the string verbatim, and the later
    # session.execute(clause) runs it. Without these the taint dies in the
    # wrapper and `execute` sees a clean argument. Listed as both a bare call
    # (`text(sql)`) and an attribute call (`sqlalchemy.text` / `db.text`), since
    # the frontend resolves the callee differently per import style. They only
    # FORWARD taint, so all-constant and parameterized queries are unaffected.
    propagators:
      - "py:text"
      - "py:*.text"
      - "py:literal_column"
      - "py:*.literal_column"
    # No built-in sanitizer neutralizes tainted input for raw SQL string
    # construction; the fix is parameterized queries, not escaping.
    # Percent-encoding turns `'` into %27 and a database does not decode it, so
    # a quoted value cannot break out of a literal (see _default-propagators.yaml,
    # where it is a propagator for the URL classes it does NOT neutralize).
    sanitizers:
      - "py:*urllib.parse.quote"
      - "py:*urllib.parse.quote_plus"
