# SQL injection: untrusted request input flowing into a DB-API cursor/query
# execution without parameterization.
#
# The "#0" suffix on each sink names the LOGICAL (source-level) index of the
# query-string argument, so a parameterized call like
# cursor.execute("... = ?", userInput) -- where userInput is a bound
# placeholder value at a later position, not part of the query text -- is NOT
# flagged. This mirrors go-sql-injection.yaml's identical treatment of
# database/sql's Query/Exec family.
rules:
  - id: py-sql-injection
    languages: [python]
    severity: high
    cwe: CWE-89
    message: >-
      Untrusted input flows into a database query execution without
      parameterized arguments, which may allow SQL injection. Use
      parameterized queries (e.g. cursor.execute(sql, params)) instead of
      concatenating or formatting user input into the query string.
    extend: $_py-sources.yaml
    sinks:
      - "py:*.execute#0"
      - "py:*.executemany#0"
      - "py:*.executescript#0"
      # SQLAlchemy's raw-SQL escape hatch: runs the string with no parameterization.
      - "py:*.exec_driver_sql#0"
    # An ORM's raw-SQL wrapper is a PASSTHROUGH, not a sink: sqlalchemy.text(sql)
    # returns a TextClause carrying the string verbatim, and it is the later
    # session.execute(clause) that runs it. Without these the taint dies inside the
    # wrapper, so `execute` sees a clean argument and nothing fires -- which is why
    # ORM-backed apps reported zero SQL-injection findings while other classes fired
    # in the same code. Covered as both a bare call (`text(sql)`) and an attribute
    # call (`sqlalchemy.text` / Flask-SQLAlchemy's `db.text`), since the frontend
    # resolves the callee differently per import style.
    #
    # These only FORWARD taint, never create it, so a query built entirely from
    # constants stays untainted and the parameterized forms are unaffected.
    propagators:
      - "py:text"
      - "py:*.text"
      - "py:literal_column"
      - "py:*.literal_column"
    # No built-in sanitizer neutralizes tainted input for raw SQL string
    # construction; the fix is parameterized queries, not escaping.
    sanitizers: []
