# Open redirect: untrusted input flowing into a response redirect (Express).
rules:
  - id: js-open-redirect
    languages: [javascript]
    severity: medium
    cwe: CWE-601
    message: >-
      Untrusted request input flows into a response redirect, which allows an
      open redirect. Validate the target against an allowlist instead of
      redirecting to a user-controlled URL.
    extend: $_js-sources.yaml
    # Default guard for every sink below (a sink may override with its own
    # `when:`): hostFixed() is an engine-supplied FACT about how the tainted URL
    # string was built -- a constant scheme://host prefix ahead of the taint means
    # the attacker controls only the path/query and cannot choose the host.
    when: 'not hostFixed()'
    sinks:
      - "js:*.redirect"
    sanitizers:
      - "js:encodeURIComponent"
    propagators: []
    # An application allowlist predicate (isSafeUrl(target)) that gates the
    # redirect: when its boolean result controls an IF that dominates the sink on
    # the path taken, the target was validated and the redirect is not open
    # (ENG-9). Requires the real CFG + dominators (guards.go), which the JS
    # frontend now emits.
    validators:
      - "js:*isSafeUrl"
