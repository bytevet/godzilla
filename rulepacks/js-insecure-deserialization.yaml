# Insecure deserialization: untrusted data reaching a deserializer that can
# revive FUNCTIONS, not just data — RCE with no eval in the application itself.
rules:
  - id: js-insecure-deserialization
    languages: [javascript]
    severity: critical
    cwe: CWE-502
    message: >-
      Untrusted input flows into a deserializer that can reconstruct functions,
      which may allow remote code execution. Use JSON.parse for data; if a richer
      format is required, choose one that cannot revive callables.
    extend: $_js-sources.yaml
    # Package-qualified, not bare `js:*unserialize`: session stores and codec
    # wrappers conventionally expose a JSON-backed `unserialize` hook, and a bare
    # member glob makes every one of them a critical false positive. The frontend
    # resolves a require alias back to the package, so the qualified name matches
    # however the import was spelled.
    sinks:
      # node-serialize revives a "$$ND_FUNC$$" field by eval'ing it (CVE-2017-5941);
      # the serialize-to-js / funcster families do the same by design.
      - "js:*node-serialize.unserialize"
      - "js:*funcster.deepDeserialize"
      - "js:*serialize-to-js.deserialize"
      # cryo and similar "JSON but with types" revivers reconstruct prototypes.
      - "js:*cryo.parse"
    # NOT a sink: js-yaml v4's `load` uses the default schema and cannot construct
    # arbitrary types, so flagging it would fire on every modern codebase.
    sanitizers:
      - "js:*JSON.parse"
