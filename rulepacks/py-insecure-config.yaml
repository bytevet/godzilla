# Insecure security-configuration flags: a call that is safe by default made
# dangerous by an explicit keyword argument. The flag itself is the defect, so
# these are `kind: dangerous-call` rules gated on the keyword's name AND value --
# `kwargs` indexes the call's arguments by the keyword they were passed under
# (from the Python frontend's builtin.kwarg marker), without which `verify=False`
# would be indistinguishable from any other false keyword. A keyword the call
# does not pass reads as the zero argument, so the guard is simply false there.
#
# All ship severity: low + confidence: medium, keeping them advisory under the
# default `-fail-on medium` gate and inside the LLM reviewer's adjudication
# range. A hardcoded-High call-site rule flooded a project once already.
rules:
  - id: py-insecure-tls-verify
    languages: [python]
    kind: dangerous-call
    severity: low
    confidence: medium
    cwe: CWE-295
    message: >-
      TLS certificate verification is disabled (verify=False), so the connection
      is trivially machine-in-the-middled: any certificate is accepted, including
      an attacker's. Remove verify=False; if a private CA is in use, point the
      client at its bundle instead.
    callees:
      - callee: "py:*requests.*"
        when: 'kwargs.verify.String == "false"'
      - callee: "py:*httpx.*"
        when: 'kwargs.verify.String == "false"'
      - callee: "py:*aiohttp.*"
        when: 'kwargs.verify.String == "false"'
      # A Session/client instance call (s.get(...)) lowers to an opaque receiver,
      # so the callee cannot be anchored to the library. The guard carries the
      # precision here: `verify` named False is a TLS switch in every client
      # library that accepts it, so a wildcard receiver adds reach, not noise.
      - callee: "py:*.request"
        when: 'kwargs.verify.String == "false"'

  - id: py-flask-debug-enabled
    languages: [python]
    kind: dangerous-call
    severity: low
    confidence: medium
    cwe: CWE-489
    message: >-
      The development server is started with debug=True, which exposes the
      Werkzeug interactive debugger. Anyone who can reach the app and trigger a
      traceback gets an in-browser Python console -- remote code execution. Never
      enable it outside local development.
    callees:
      - callee: "py:*.run"
        when: 'kwargs.debug.String == "true"'

  - id: py-jinja-autoescape-off
    languages: [python]
    kind: dangerous-call
    severity: low
    confidence: medium
    cwe: CWE-79
    message: >-
      The template environment is built with autoescape=False, so every rendered
      variable is emitted as raw HTML and any untrusted value becomes stored or
      reflected XSS. Enable autoescaping and mark the rare trusted fragment
      explicitly instead.
    callees:
      - callee: "py:*Environment"
        when: 'kwargs.autoescape.String == "false"'

  - id: py-langchain-dangerous-code
    languages: [python]
    kind: dangerous-call
    severity: low
    confidence: medium
    cwe: CWE-94
    message: >-
      An agent is constructed with allow_dangerous_code=True, which lets the LLM
      execute generated Python against the host. Prompt content is untrusted
      input, so this is remote code execution by design (the langflow
      CVE-2026-27966 shape). Keep the flag off, or sandbox the executor.
    callees:
      # The keyword is specific to langchain's opt-in for code-executing agents,
      # so the guard is the discriminator and the receiver need not be anchored.
      - callee: "py:*agent*"
        when: 'kwargs.allow_dangerous_code.String == "true"'
      - callee: "py:*Agent*"
        when: 'kwargs.allow_dangerous_code.String == "true"'
      - callee: "py:*Chain*"
        when: 'kwargs.allow_dangerous_code.String == "true"'
      - callee: "py:*Tool*"
        when: 'kwargs.allow_dangerous_code.String == "true"'

  # CWE-502 rather than the flag rules above, but it belongs with them: the defect
  # is the keyword, not a dataflow. The taint rule cannot reach this class at all --
  # in ray's webdataset decoder the bytes come from iterating a function parameter
  # (an archive shard), so there is no modeled source to seed even though
  # torch.load IS a modeled sink. The flag makes it detectable with no source.
  - id: py-torch-unsafe-load
    languages: [python]
    kind: dangerous-call
    severity: low
    confidence: medium
    cwe: CWE-502
    message: >-
      torch.load(..., weights_only=False) unpickles arbitrary Python objects while
      loading a checkpoint, so any checkpoint an attacker can influence -- a
      downloaded model, a dataset shard, a user upload -- becomes remote code
      execution. PyTorch made weights_only=True the default in 2.6 for exactly this
      reason. Keep the default, or load untrusted checkpoints in a sandbox.
    callees:
      # Anchored on torch.load rather than matched on the keyword alone: PyTorch
      # Lightning's trainer.save_checkpoint(..., weights_only=False) uses the SAME
      # keyword to mean "save the whole model, not just weights", which is harmless.
      # Matching the keyword without the callee would flag it (verified against
      # ray's _lightning_utils.py, which this correctly leaves alone).
      - callee: "py:*torch.load"
        when: 'kwargs.weights_only.String == "false"'
