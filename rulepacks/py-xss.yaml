# Cross-site scripting: untrusted HTTP/URL input flowing into an HTTP
# response body without escaping.
rules:
  - id: py-xss
    languages: [python]
    # Align with go-xss/js-xss (same CWE-79) so the CI gate treats reflected
    # XSS identically regardless of source language.
    severity: medium
    cwe: CWE-79
    message: >-
      Untrusted input flows into an HTTP response body without being
      HTML-escaped, which may allow cross-site scripting (XSS). Escape the
      value (e.g. markupsafe.escape / html.escape) or render it through a
      template engine with autoescaping enabled instead of concatenating it
      directly into the response body.
    extend: $_py-sources.yaml
    sinks:
      # render_template_string#0 pins the TEMPLATE SOURCE: building the template
      # itself from tainted input is XSS, whereas a tainted context variable
      # (`render_template_string(fixed, name=user)`) is autoescaped and safe.
      # The Response sinks are named individually rather than globbed as
      # "*Response", which also matched File/StreamingResponse (path traversal)
      # and RedirectResponse (open redirect).
      - "py:*render_template_string#0"
      - "py:Response"
      - "py:*.Response"
      - "py:*HTMLResponse"
      - "py:*HttpResponse"
      - "py:*PlainTextResponse"
      - "py:*make_response"
    # Explicit HTML-escapers only: a "py:*escape" glob would also match
    # html.unescape, the OPPOSITE of a sanitizer (COV-9).
    sanitizers:
      - "py:*markupsafe.escape"
      - "py:*markupsafe.Markup"
      - "py:*html.escape"
      - "py:*flask.escape"
      - "py:*cgi.escape"
      # Percent-encoding escapes `<` and `>`, so the value cannot open a tag.
      - "py:*urllib.parse.quote"
      - "py:*urllib.parse.quote_plus"
    # json.dumps embeds its argument's data verbatim, so it forwards taint rather
    # than clearing it: `HttpResponse(json.dumps(user_data))` is reflected-JSON
    # XSS when the body is served without a safe content type.
    propagators:
      - "py:*json.dumps"
      - "py:*json.dump"
