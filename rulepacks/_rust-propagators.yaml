# Shared Rust string/Option/Result/iterator propagators — the CORE set common to
# ALL FOUR Rust dataflow rules (SQLi, command injection, SSRF, path traversal),
# pulled in with `extend: [$_rust-sources.yaml, $_rust-propagators.yaml]`.
# The five entries the path rule deliberately does NOT take live in
# _rust-propagators-extra.yaml; rust-path-traversal adds its own path-specific
# entries inline instead.
propagators:
  - "rust:*unwrap"
  - "rust:*unwrap_or"
  - "rust:*unwrap_or_default"
  - "rust:*expect"
  - "rust:*as_ref"
  - "rust:*as_bytes"
  - "rust:*clone"
  - "rust:*deref"
  - "rust:*into"
  - "rust:*collect"
  - "rust:*push_str"
  - "rust:*index"
  - "rust:*get"
  - "rust:*nth"
  - "rust:*first"
  - "rust:*last"
  - "rust:*iter"
  - "rust:*next"
  - "rust:*map"
  - "rust:*chars"
  - "rust:*split"
  - "rust:*lines"
  - "rust:*from_utf8"
  - "rust:*from_utf8_lossy"
  - "rust:*String::from"
  - "rust:format"
  - "rust:*must_use"
  - "rust:*new_display"
  - "rust:*new_debug"
  - "rust:*Arguments::new"
  # Older rustc (observed: 1.90.0; current stable 1.98 still prints the
  # Arguments::new form above) lowers format!'s Arguments constructor through an
  # inherent impl instead: core::fmt::rt::<impl Arguments<'_>>::new_v1 (args) /
  # ::new_const (literal-only). normalizeName drops the `<impl Arguments<'_>>`
  # group entirely, so the engine sees `rust:core::fmt::rt::new_v1` — anchored to
  # `fmt::rt::`, not a bare `*rt::new_v1`, so a user module literally named `rt`
  # cannot trip it. Purely additive: the entry above must keep matching current
  # stable unchanged.
  - "rust:*fmt::rt::new_v1"
  - "rust:*fmt::rt::new_const"
  # A placeholder carrying a width/precision/fill spec (`{:>10}`) lowers to a
  # THIRD, differently-named constructor instead of new_v1 — same anchoring
  # rationale as the two entries above. mir.go's reconstructFormatTemplate
  # handles its template conservatively (no const generics to read an exact
  # argument count from), never inventing a false "this host is fixed".
  - "rust:*fmt::rt::new_v1_formatted"
