# Hardcoded credentials (CWE-798). These are `kind: secret` rules: non-dataflow
# and not even call-site, since a leaked credential is a STRING, not a call. Each
# rule's `matches` regexp is run over every string constant in the lowered IR and
# over the lines of textual config files the frontends never parse (.env, CI
# YAML, Dockerfile, ...), so the same rule catches a credential wherever it was
# written.
#
# Detectors are deliberately specific -- a fixed vendor prefix or a structural
# marker -- rather than entropy-based. An entropy heuristic finds more real
# secrets but cannot be gated on in CI, and a scanner that cries wolf gets turned
# off. Confidence is high because a match on these shapes is close to
# unambiguous; unlike a dataflow rule there is no flow to be uncertain about.
#
# No `languages:` here: a credential is language-independent, and these also run
# over config files that have no language at all. Adding one would scope a rule
# to a language's IR constants.
rules:
  - id: secret-private-key
    kind: secret
    severity: critical
    confidence: high
    cwe: CWE-798
    message: Hardcoded private key
    matches: '-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----'

  - id: secret-aws-access-key
    kind: secret
    severity: high
    confidence: high
    cwe: CWE-798
    message: Hardcoded AWS access key ID
    matches: '\bAKIA[0-9A-Z]{16}\b'

  - id: secret-gcp-api-key
    kind: secret
    severity: high
    confidence: high
    cwe: CWE-798
    message: Hardcoded Google API key
    matches: '\bAIza[0-9A-Za-z\-_]{35}\b'

  - id: secret-slack-token
    kind: secret
    severity: high
    confidence: high
    cwe: CWE-798
    message: Hardcoded Slack token
    matches: '\bxox[baprs]-[0-9A-Za-z-]{10,48}\b'

  - id: secret-slack-webhook
    kind: secret
    severity: high
    confidence: high
    cwe: CWE-798
    message: Hardcoded Slack webhook URL
    matches: 'https://hooks\.slack\.com/services/[A-Za-z0-9/_+-]{20,}'

  - id: secret-github-token
    kind: secret
    severity: high
    confidence: high
    cwe: CWE-798
    message: Hardcoded GitHub token
    matches: '\bgh[pousr]_[0-9A-Za-z]{36}\b'

  - id: secret-gitlab-pat
    kind: secret
    severity: high
    confidence: high
    cwe: CWE-798
    message: Hardcoded GitLab personal access token
    matches: '\bglpat-[0-9A-Za-z_-]{20}\b'

  - id: secret-jwt
    kind: secret
    # Medium, not high: a JWT in source is very often an expired example token in
    # a doc string or test fixture rather than a live credential.
    severity: medium
    confidence: high
    cwe: CWE-798
    message: Hardcoded JSON Web Token
    matches: '\beyJ[0-9A-Za-z_-]{10,}\.eyJ[0-9A-Za-z_-]{10,}\.[0-9A-Za-z_-]{10,}\b'

  - id: secret-stripe-key
    kind: secret
    severity: high
    confidence: high
    cwe: CWE-798
    message: Hardcoded Stripe live secret key
    matches: '\b(?:sk|rk)_live_[0-9A-Za-z]{24,}\b'

  - id: secret-openai-anthropic-key
    kind: secret
    severity: high
    confidence: high
    cwe: CWE-798
    message: Hardcoded OpenAI/Anthropic-style API key
    matches: '\bsk-(?:ant-|proj-)?[A-Za-z0-9_-]{20,}\b'

  - id: secret-npm-token
    kind: secret
    severity: high
    confidence: high
    cwe: CWE-798
    message: Hardcoded npm access token
    matches: '\bnpm_[0-9A-Za-z]{36}\b'

  - id: secret-sendgrid-key
    kind: secret
    severity: high
    confidence: high
    cwe: CWE-798
    message: Hardcoded SendGrid API key
    matches: '\bSG\.[0-9A-Za-z_-]{22}\.[0-9A-Za-z_-]{43}\b'

  - id: secret-square-token
    kind: secret
    severity: high
    confidence: high
    cwe: CWE-798
    message: Hardcoded Square access token
    matches: '\bsq0(?:atp|csp)-[0-9A-Za-z_-]{22,43}\b'

  - id: secret-db-connection
    kind: secret
    severity: high
    confidence: high
    cwe: CWE-798
    message: Hardcoded database credentials in connection URL
    matches: '\b(?:postgres|postgresql|mysql|mongodb(?:\+srv)?|redis|amqps?)://[^\s:@/]+:[^\s:@/]{3,}@'
