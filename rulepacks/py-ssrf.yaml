# Server-Side Request Forgery: untrusted HTTP/URL input flowing into an
# outbound HTTP request's target URL.
rules:
  - id: py-ssrf
    languages: [python]
    # Align with go-ssrf (same CWE-918) so the CI gate treats SSRF
    # identically regardless of source language.
    severity: high
    cwe: CWE-918
    message: >-
      Untrusted input flows into an outbound HTTP request URL, which may
      allow server-side request forgery (SSRF) to internal or unintended
      hosts. Validate the destination against an allow-list before making
      the request.
    extend: $_py-sources.yaml
    when: 'not hostFixed()'
    sinks:
      - "py:requests.get"
      - "py:requests.post"
      # requests.request(method, url, ...) — the generic verb-dispatching call
      # (CVE-2025-52967, mlflow gateway_proxy_handler). The URL is arg #1, so pin
      # it with #1 (the HTTP method in arg #0 is not the injection point).
      - "py:*requests.request#1"
      # httpx outbound requests, module-level functions and the client-instance
      # streaming API (CVE-2024-48052, gradio save_url_to_cache:
      # client.stream("GET", url, follow_redirects=True)). For .stream/.request
      # the URL follows the HTTP method, so pin arg #1; httpx.get/post take the
      # URL as arg #0. Scoped to httpx.* and *client.* (the httpx.Client /
      # AsyncClient idiom) rather than a bare *.stream/*.request to avoid
      # matching unrelated stream/request methods.
      - "py:httpx.get"
      - "py:httpx.post"
      - "py:httpx.stream#1"
      - "py:httpx.request#1"
      - "py:*client.stream#1"
      - "py:*client.request#1"
      - "py:*urlopen"
      # pycurl sets the URL as an OPTION — `c.setopt(pycurl.URL, url)` — so there
      # is no URL-named call to match, and an app with its own HTTP layer bottoms
      # out here rather than at requests/httpx (pyload, CVE-2026-35187).
      # The option in arg #0 is a module attribute, not a literal, so it does not
      # reconstruct and no guard can tell pycurl.URL from pycurl.POSTFIELDS.
      # Pinning the VALUE (#1) is as narrow as this gets: untrusted data reaching
      # a non-URL curl option is a known false positive, accepted because taint is
      # still required to fire.
      - "py:*.setopt#1"
    # No built-in sanitizer neutralizes tainted input for a request URL;
    # the fix is allow-listing the destination host, not escaping.
    sanitizers: []
    # Percent-encoding is re-encoding, not sanitizing — quote() leaves `:` and
    # `/` unescaped, so the HOST survives it and the request still goes wherever
    # the attacker said. An app with its own HTTP layer normalizes the URL on the
    # way to the sink (pyload's myquote -> quote, CVE-2026-35187), and without
    # this the flow dies at the encoder.
    #
    # Deliberately scoped to THIS rule rather than added to
    # _default-propagators.yaml, which applies to every rule: quote() percent-
    # encodes `'` to %27 by default, and a database does not percent-decode, so
    # the same propagator would manufacture a false positive at a SQL sink. It
    # neutralizes for SQL; it does not neutralize for SSRF.
    propagators:
      - "py:*urllib.parse.quote"
      - "py:*urllib.parse.quote_plus"
      - "py:*urllib.parse.urlencode"
