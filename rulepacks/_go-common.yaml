# Shared Go request sources, request-object provenance, and the strings.Join
# propagator. Pulled into the go-*.yaml rules with `extend: $_go-common.yaml`.
sources:
  # A source may only name a type that is untrusted BY CONSTRUCTION. A generic
  # container usable on either side of a request (http.Header, url.Values) is a
  # PROPAGATOR instead — see _default-propagators.yaml. As a source it generated
  # taint from nothing, so `w.Header().Get(...)` on the RESPONSE writer fired
  # critical; control: test/go/response_header_safe.
  - "go:@net/http.Request" # synthetic *http.Request source (addHTTPRequestSource)
  - "go:*gin-gonic/gin.Context*.Query"
  - "go:*gin-gonic/gin.Context*.DefaultQuery"
  - "go:*gin-gonic/gin.Context*.QueryArray"
  - "go:*gin-gonic/gin.Context*.QueryMap"
  - "go:*gin-gonic/gin.Context*.GetQuery"
  - "go:*gin-gonic/gin.Context*.Param"
  - "go:*gin-gonic/gin.Context*.PostForm"
  - "go:*gin-gonic/gin.Context*.DefaultPostForm"
  - "go:*gin-gonic/gin.Context*.GetHeader"
  - "go:*labstack/echo*Context*.QueryParam"
  - "go:*labstack/echo*Context*.QueryParams"
  - "go:*labstack/echo*Context*.Param"
  - "go:*labstack/echo*Context*.FormValue"
  - "go:*labstack/echo*Context*.FormParams"
  - "go:*go-chi/chi*.URLParam"
  - "go:*gorilla/mux.Vars"
  - "go:*web.Params" # macaron/grafana free-function route params
  # macaron's own name for the same accessor. Both spellings are needed: a caller
  # may reach it through a re-exporting variable (`var Params = macaron.Params`,
  # grafana's pkg/web), and callee names are SEMANTIC, so such a call resolves to
  # the function rather than to the variable the source wrote.
  - "go:*macaron.Params"
  - "go:*gofiber/fiber*.Ctx*.Query"
  - "go:*gofiber/fiber*.Ctx*.Params"
  - "go:*gofiber/fiber*.Ctx*.FormValue"
  - "go:*gofiber/fiber*.Ctx*.Cookies"
  - "go:*gofiber/fiber*.Ctx*.Get"
  - "go:*fasthttp.RequestCtx*.FormValue"
  - "go:*fasthttp.RequestCtx*.UserValue"
  # A binder fills a caller-allocated struct instead of returning the untrusted
  # value — it returns only an error — so a bare source glob would taint
  # nothing (and, worse, `err.Error()` reaching a sink through cast/config
  # helpers was ENG-14b's false-positive chain). The "#0" spec names the
  # out-parameter the call fills instead of its result; it is UNCONDITIONAL
  # here because a binder reads the request itself, with nothing upstream
  # needing to already be tainted. See test/go/binder_out_param.
  - "go:*gin-gonic/gin.Context*.ShouldBind#0"
  - "go:*gin-gonic/gin.Context*.ShouldBindJSON#0"
  - "go:*gin-gonic/gin.Context*.ShouldBindQuery#0"
  - "go:*gin-gonic/gin.Context*.ShouldBindUri#0"
  - "go:*gin-gonic/gin.Context*.BindJSON#0"
  - "go:*labstack/echo*Context*.Bind#0"
request_object_sources:
  - "go:@net/http.Request"
propagators:
  - "go:strings.Join"
  # A decoder's out-parameter fill is a PROPAGATOR, not a source: unlike a
  # binder, it does not read the request itself — it transforms whatever
  # bytes it is handed — so the fill must be CONDITIONAL on some other operand
  # (the data being decoded) already being tainted, or parsing a constant
  # config blob would fabricate taint out of nothing. See
  # test/go/json_unmarshal_taint and its _safe control.
  - "go:encoding/json.Unmarshal#1"
  - "go:gopkg.in/yaml*.Unmarshal#1"
  - "go:encoding/xml.Unmarshal#1"
