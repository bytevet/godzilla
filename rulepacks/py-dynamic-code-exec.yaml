# Dynamic code execution (Python): a call that runs code chosen at runtime. The
# call-site twin of py-code-injection, which needs a modeled source to reach the
# sink — these fire whatever the code's origin, catching the common case where
# it arrives from a channel Godzilla does not model (an HTTP response body, an
# LLM completion, a database row, a downloaded model repository). When both fire
# on one call the richer dataflow finding wins (internal/scan dropCoLocatedDangerous).
#
# `severity: low` keeps these reported without failing the default gate, since
# proving dynamic execution is not proving attacker control; `confidence: medium`
# puts them in the LLM reviewer's range.
rules:
  - id: py-dynamic-code-exec
    kind: dangerous-call
    languages: [python]
    severity: low
    confidence: medium
    cwe: CWE-95
    message: >-
      eval()/exec() on a value that is not a compile-time constant: whatever this
      string contains at runtime is executed as Python code. This is the shape of
      llama-index CVE-2024-4181 (eval of a fetched HTTP/LLM response body) and of
      langflow's custom-component exec. Dispatch on an allowlist instead of
      evaluating a computed string; to parse a data literal use ast.literal_eval.
    # Exact builtin names (no wildcard) so the SAFE ast.literal_eval — a distinct
    # function that only parses literals — is never matched, mirroring
    # py-code-injection. compile() is deliberately absent: it produces a code
    # object without executing one, so the eval/exec that actually runs it is
    # where the finding belongs, and including it would double-report every
    # compile -> exec pair.
    callees:
      # `!arg[0].Complete` is true unless the WHOLE argument is a compile-time
      # constant, so eval("{'a': 1}") stays silent while eval(resp.text) fires.
      # A malformed (zero-argument) call makes the guard error out, and a guard
      # error suppresses rather than fires — the intended fail-closed direction.
      - callee: "py:eval"
        when: "!arg[0].Complete"
      - callee: "py:exec"
        when: "!arg[0].Complete"

  - id: py-hf-dynamic-module
    kind: dangerous-call
    languages: [python]
    severity: low
    confidence: medium
    cwe: CWE-94
    message: >-
      This downloads a model repository's own Python and imports it, so whoever
      chooses the repo chooses what runs in this process. Transformers gates it on
      trust_remote_code; a caller that forwards a repo id without also forwarding
      that decision has no gate at all (vLLM CVE-2026-22807). Resolve the flag
      before the load and refuse the load when it is unset.
    callees:
      # Deliberately UNGUARDED. The obvious guard — `kwargs.trust_remote_code`
      # absent — cannot work: the frontend marks only CONSTANT keyword values, and
      # the flag is threaded from config (`trust_remote_code=cfg.trust_remote_code`),
      # so it reads as absent both before and after a fix. Verified: the guarded
      # form still fires on the FIXED commit. Add the guard only once non-constant
      # keywords are marked, or the rule can never go green for a user who fixed it.
      #
      # A bare suffix glob is safe here where it would not be for a name like
      # `.write`: this API belongs to one library and has no benign namesake. It
      # also covers `try_get_class_from_dynamic_module`, which ends with it.
      - callee: "py:*get_class_from_dynamic_module"
