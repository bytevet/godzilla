# Dynamic code execution (Python): eval()/exec() on a non-constant value. The
# call-site twin of py-code-injection, which needs a modeled source to reach the
# sink — this fires whatever the value's origin, catching the common case where
# it arrives from a channel Godzilla does not model (an HTTP response body, an
# LLM completion, a database row). When both fire on one call the richer
# dataflow finding wins (internal/scan dropCoLocatedDangerous).
#
# `severity: low` keeps this reported without failing the default `-fail-on
# medium` gate, since "this argument is not constant" proves dynamic execution
# but not attacker control. `confidence: medium` overrides the dangerous-call
# default of High so the LLM reviewer, which only adjudicates at or below
# medium, actually sees it.
rules:
  - id: py-dynamic-code-exec
    kind: dangerous-call
    languages: [python]
    severity: low
    confidence: medium
    cwe: CWE-95
    message: >-
      eval()/exec() on a value that is not a compile-time constant: whatever this
      string contains at runtime is executed as Python code. This is the shape of
      llama-index CVE-2024-4181 (eval of a fetched HTTP/LLM response body) and of
      langflow's custom-component exec. Dispatch on an allowlist instead of
      evaluating a computed string; to parse a data literal use ast.literal_eval.
    # Exact builtin names (no wildcard) so the SAFE ast.literal_eval — a distinct
    # function that only parses literals — is never matched, mirroring
    # py-code-injection. compile() is deliberately absent: it produces a code
    # object without executing one, so the eval/exec that actually runs it is
    # where the finding belongs, and including it would double-report every
    # compile -> exec pair.
    callees:
      # `!arg[0].Complete` is true unless the WHOLE argument is a compile-time
      # constant, so eval("{'a': 1}") stays silent while eval(resp.text) fires.
      # A malformed (zero-argument) call makes the guard error out, and a guard
      # error suppresses rather than fires — the intended fail-closed direction.
      - callee: "py:eval"
        when: "!arg[0].Complete"
      - callee: "py:exec"
        when: "!arg[0].Complete"
