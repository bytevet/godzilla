# Path traversal: untrusted request input flowing into filesystem access
# without path normalization/containment.
rules:
  - id: js-path-traversal
    languages: [javascript]
    # Align with go-path-traversal (same CWE-22) so the CI gate treats path
    # traversal identically regardless of source language.
    severity: high
    cwe: CWE-22
    message: >-
      Untrusted request input (query string, route params, or body) flows
      into a filesystem path without being cleaned or validated, which may
      allow path traversal (e.g. "../" sequences) to read or serve files
      outside the intended directory. Validate/normalize the path and confirm
      it stays within an allowed base directory before use.
    extend: $_js-sources.yaml
    # `*fs.readFile*` also matches the Sync/promises variants. `*.sendFile` is
    # deliberately broad (not `*res.sendFile`) so a chained
    # res.status(200).sendFile(p) -- callee "js:<dynamic>.sendFile" -- is still
    # caught, mirroring js-xss's broad `js:*.send`.
    sinks:
      - "js:*fs.readFile*"
      - "js:*.sendFile"
      # File reads are not always on the literal `fs` module: a static-file
      # server often reads through an injected filesystem abstraction (memfs,
      # webpack-dev-middleware's `context.outputFileSystem`), so the receiver is
      # opaque. Match by method name instead. These act on a path argument and
      # cannot fire without taint, so the broad receiver adds no FP.
      - "js:*.statSync"
      - "js:*.createReadStream"
    # path.basename strips the directory component, so it genuinely prevents
    # traversal. path.join / path.resolve / path.normalize do NOT contain input
    # to a base directory ("/data" + "../../etc" resolves to "/etc"), so they are
    # propagators, not sanitizers.
    sanitizers:
      - "js:*path.basename"
    # (path.normalize needs no entry: `js:*.normalize` is a default propagator.)
    propagators:
      - "js:*path.join"
      - "js:*path.resolve"
      # URL/query decoding WIDENS the traversal surface (`%2e%2e` -> `..`), so
      # these carry taint rather than clearing it: decoding never contains a
      # path to a base directory.
      - "js:*querystring.unescape"
      - "js:*querystring.parse"
      - "js:*url.parse"
