# Command injection: untrusted request input flowing into a shell/process
# execution sink.
rules:
  - id: py-command-injection
    languages: [python]
    severity: critical
    cwe: CWE-78
    message: >-
      Untrusted input flows into a shell/process execution call, which may
      allow arbitrary command execution. Avoid building shell commands from
      user input; if unavoidable, pass arguments as a list and never invoke
      a shell interpreter (shell=True).
    extend: $_py-sources.yaml
    # Same rule as $_shell-argv.yaml, but Python's tainted value arrives INSIDE a
    # lowered container, so the program is `.Elems[0]` rather than `arg[0]`.
    #
    # `shell=` is cleared only when absent or literally false. A non-constant
    # `shell=flag` records no keyword name at all (the frontend marks constants
    # only), so it would read as absent — hence every non-tainted argument must
    # be a keyword we can name.
    # The two container clauses do different jobs. `len(.Elems) > 0` proves the
    # index below is safe — a dict has no .Elems, and .Elems[0] on it would raise,
    # which SUPPRESSES the sink rather than reporting it. `.TaintInChildren` is
    # about where the taint is: a list mutated after it was built (`l[0] = x`) has
    # elements that all look constant, and only this stops it being cleared.
    when: >-
      not ((kwargs.shell.String == "" or kwargs.shell.String == "false")
           and all(filter(arg, not .Tainted), .Name != "")
           and any(arg, .Tainted)
           and all(filter(arg, .Tainted),
                   len(.Elems) > 0
                   and .TaintInChildren
                   and .Elems[0].Complete
                   and not (.Elems[0].String matches "(^|/)(sh|bash|dash|zsh|ksh|csh|tcsh|fish|ash|busybox|env|xargs|sudo|node|nodejs|deno|bun|python[0-9.]*|perl|ruby|php|awk|gawk|mawk|find|ssh|cmd|powershell|pwsh|wscript|cscript)([.]exe)?$")))
    sinks:
      - "py:os.system"
      - "py:os.popen"
      - "py:subprocess.*"
      - "py:*.subprocess.*"
    # No built-in sanitizer neutralizes tainted input for shell command
    # construction; avoid passing tainted data to a shell entirely.
    sanitizers:
      - "py:*shlex.quote"
    propagators:
      # Deserializing an untrusted request body yields tainted data (the parsed
      # dict/list carries the attacker's input forward). Forwards EXISTING taint
      # only. CVE-2025-47782 motioneye: json.loads(self.request.body) -> device
      # field -> shell pipeline.
      - "py:*json.loads"
