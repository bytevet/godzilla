# Command injection: untrusted request input flowing into a shell/process
# execution sink.
rules:
  - id: py-command-injection
    languages: [python]
    severity: critical
    cwe: CWE-78
    message: >-
      Untrusted input flows into a shell/process execution call, which may
      allow arbitrary command execution. Avoid building shell commands from
      user input; if unavoidable, pass arguments as a list and never invoke
      a shell interpreter (shell=True).
    extend: $_py-sources.yaml
    # Passing tainted data as an element of a direct argv LIST is not command
    # injection: the value reaches execve as one argument, never a shell
    # interpreter. The Python frontend lowers container literals to
    # builtin.aggregate so element taint survives into a later whole-container
    # use, which would otherwise make the safe argv form fire.
    #
    # Suppress only when ALL of these hold: no shell is requested; every tainted
    # argument arrived as an in-place container ("aggregate"); and that
    # container's argv[0] is a KNOWN program that is not itself a shell. The last
    # clause is what keeps `subprocess.run(["sh", "-c", tainted])` firing — an
    # argv list is only safe if the program it launches does not re-interpret its
    # arguments.
    #
    # Every clause demands positive evidence, so anything unproven fires: a
    # tainted plain string, `shell=True` (which joins the list into one shell
    # string), an argv[0] that is not a compile-time constant, or a container
    # whose structure the engine did not reconstruct all leave .Elems empty or
    # the match false. `kwargs.shell` is the zero Arg when no `shell=` is passed.
    # See test/python/subprocess_argv_safe, subprocess_argv_shell and
    # subprocess_argv_shell_program.
    when: >-
      not (kwargs.shell.String != "true"
           and any(arg, .Tainted)
           and all(filter(arg, .Tainted),
                   .Type == "aggregate"
                   and len(.Elems) > 0
                   and .Elems[0].Complete
                   and not (.Elems[0].String matches "(^|/)(sh|bash|dash|zsh|ksh|csh|tcsh|fish|ash|busybox|env|xargs)$")))
    sinks:
      - "py:os.system"
      - "py:os.popen"
      - "py:subprocess.*"
      - "py:*.subprocess.*"
    # No built-in sanitizer neutralizes tainted input for shell command
    # construction; avoid passing tainted data to a shell entirely.
    sanitizers:
      - "py:*shlex.quote"
    propagators:
      # Deserializing an untrusted request body yields tainted data (the parsed
      # dict/list carries the attacker's input forward). Forwards EXISTING taint
      # only. CVE-2025-47782 motioneye: json.loads(self.request.body) -> device
      # field -> shell pipeline.
      - "py:*json.loads"
