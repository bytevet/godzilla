# Shared browser-controlled sources for the SFC template-XSS packs (vue-xss,
# svelte-xss, react-xss), which model the same browser attack surface. Sanitizers
# live in _js-html-sanitizers.yaml, which packs with no shared sources still want.
# Pulled in with `extend: $_js-sfc-xss.yaml`;
# each pack keeps its framework-specific sources (Vue props/router, Svelte $page)
# inline.
sources:
  # Browser-controlled input (the URL and cookies).
  - "js:window.location*"
  - "js:*.location.href"
  - "js:*.location.search"
  - "js:*.location.hash"
  - "js:document.URL"
  - "js:document.cookie"
  - "js:*URLSearchParams*"
