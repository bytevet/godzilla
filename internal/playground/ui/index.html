<!DOCTYPE html>
<html lang="en" data-density="open">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gIR Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="base.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand"><span class="n">gIR Playground</span><a class="v" id="brand-version" href="https://github.com/bytevet/godzilla" target="_blank" rel="noopener">gIR v1</a></div>
    <span class="chip" id="file-path">—</span>
    <span class="virt-note" id="virt-note" hidden>large module · windowed</span>
    <span class="spacer"></span>
    <button class="iconbtn theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme">
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg>
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>
    </button>
  </header>

  <div class="cols" id="cols">
    <section class="col">
      <div class="colhead"><span class="k">Files</span><span class="sp"></span><span class="k" id="tree-count"></span></div>
      <div class="filterbar">
        <svg class="fi" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2 14 14"/></svg>
        <input id="tree-filter" type="text" spellcheck="false" placeholder="Filter files" aria-label="Filter files by name">
        <button class="fclear" id="tree-filter-clear" type="button" aria-label="Clear filter" hidden>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <div class="colbody" id="tree"></div>
    </section>

    <div class="resizer" data-resize="a" role="separator" aria-orientation="vertical" title="Drag to resize · double-click to reset"></div>

    <section class="col">
      <div class="colhead">
        <span class="k">Source</span><span class="sp"></span>
        <span class="stepper" id="stepper" hidden>
          <span class="lbl" id="step-lbl"></span>
          <button id="step-prev" type="button" aria-label="Previous node"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 1.5 3 5l4 3.5"/></svg></button>
          <button id="step-next" type="button" aria-label="Next node"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 1.5 7 5l-4 3.5"/></svg></button>
        </span>
        <button class="toggle-btn" id="wrap-toggle" type="button" aria-pressed="false" title="Toggle line wrap">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h12M2 8h9a2.5 2.5 0 1 1 0 5H8"/><path d="M9.5 11 8 13l1.5 2"/><path d="M2 12h3"/></svg>
          wrap
        </button>
      </div>
      <div class="colbody" id="code-wrap"><div class="code" id="code"></div></div>
    </section>

    <div class="resizer" data-resize="b" role="separator" aria-orientation="vertical" title="Drag to resize · double-click to reset"></div>

    <section class="col">
      <div class="colhead"><span class="k">gIR</span><span class="sp"></span><span class="k" id="ir-count"></span></div>
      <div class="colbody" id="ir-wrap"><div class="ir" id="ir"></div></div>
      <div class="insp-wrap">
        <button class="insp-bar" id="insp-toggle" type="button" aria-expanded="true">
          <span class="ilabel">Node</span>
          <span id="insp-sum">no selection</span>
          <span class="cv"></span>
        </button>
        <div id="insp-body"></div>
      </div>
    </section>
  </div>

  <section class="pad">
    <div class="pad-bar">
      <span class="pad-head" title="The same glob form is used by sources, sinks, propagators, sanitizers and validators">Canonical pattern</span>
      <input id="pattern" type="text" spellcheck="false" placeholder="go:*database/sql*.DB*.Query#0    —  press / to focus">
      <span class="res" id="pat-res"></span>
    </div>
    <div class="pad-body">
      <div class="matchlist" id="pat-matches"></div>
      <div class="presets" id="presets"></div>
    </div>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
